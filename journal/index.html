---
layout: journal
title: Journal
permalink: /journal/
description: Journal by Erkut Evirgen.
---

<ul class="index">
{% for post in paginator.posts %}
  <li>
    <a href="{{ post.url }}">
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%d %b %Y" }}</time>
      <span>
        <strong>{{ post.title }}</strong>
        {% if post.thumb %}<em>{{ post.thumb }}</em>{% endif %}
      </span>
    </a>
  </li>
{% endfor %}
</ul>
